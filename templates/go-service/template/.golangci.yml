# Linters are listed explicitly rather than inherited from the defaults, so a
# golangci-lint upgrade cannot silently change what `make lint` means.
version: "2"

run:
  timeout: 3m

linters:
  default: none
  enable:
    - errcheck # unchecked errors
    - govet # suspicious constructs
    - ineffassign # assignments never used
    - staticcheck # correctness, simplification, style
    - unused # unused code
    - bodyclose # unclosed HTTP response bodies
    - errorlint # error wrapping mistakes
    - noctx # HTTP requests sent without a context
    - revive # general style
    - misspell

  settings:
    revive:
      rules:
        - name: exported
          disabled: true # doc comments are reviewed, not linted

  exclusions:
    rules:
      # Tests may ignore errors that production code must not.
      - path: _test\.go
        linters:
          - errcheck
{% if not include_examples %}      # This service has no resources yet, so the scaffolding the first one will
      # call has no caller. Delete this rule once it does.
      - path: (internal/transport/http/errors\.go|internal/repository/memory/memory\.go)
        linters:
          - unused
{% endif %}
formatters:
  enable:
    - gofumpt
