# The single template definition for Mint.
#
# It lives at the repo root, and there is exactly one of it. This is not a style
# preference: Copier treats a path as VCS-tracked only when it *is* the git repo
# root, so a copier.yml under templates/go-service/ yields "Copying from
# template version None", records no _commit, and makes `copier update` exit 1
# with "cannot obtain old template references".
#
#   copier copy . ~/src/my-svc          # mint a new service
#   copier update                        # from inside a generated service
#
# The variable delimiter is {@ @}, not {{ }}. Helm and GitHub Actions' ${{ }}
# both use {{ }} heavily in files this repo will eventually generate. Blocks
# and comments stay on Jinja's defaults, {% %} and {# #}, which collide with
# nothing in this stack.
---
_subdirectory: "templates/{@ language @}-service/template"
_min_copier_version: "9.17.1"
_answers_file: ".copier-answers.yml"

_envops:
  variable_start_string: "{@"
  variable_end_string: "@}"

# Every file in the template is rendered, so source files keep their real
# extensions: main.go is main.go, not main.go.jinja. The cost is that a literal
# {% or {# in template source would need escaping — no Go, Make or YAML
# construct uses either.
_templates_suffix: ""

_tasks:
  # Generating into an existing checkout is normal, so this initialises a repo
  # only when there is not one already.
  - "git rev-parse --git-dir >/dev/null 2>&1 || git init --quiet --initial-branch=main"
  - "go mod tidy"
  - |
    printf '\n\033[1m%s\033[0m is ready.\n\n' '{@ service_name @}'
    printf '  cd %s\n' '{@ _copier_conf.dst_path @}'
    printf '  direnv allow      # picks up the pinned Go from .tool-versions\n'
    printf '  make test\n'
    printf '  make run          # :{@ port @}, admin :{@ admin_port @}\n\n'

language:
  type: str
  help: Which language should this service be written in?
  # Python lands next; the answer value is `py`, matching templates/py-service.
  choices:
    Go: go
  default: go

---
!include "questions-shared.yml"

---
module_path:
  type: str
  help: Go module path — what `go get` would be given
  default: "{@ repo_url @}"
  when: "{@ language == 'go' @}"
  validator: >-
    {% if not module_path %}A module path is required.{% endif %}

package_name:
  type: str
  help: Python package name — the importable name under src/
  default: "{@ service_name | replace('-', '_') @}"
  when: "{@ language == 'py' @}"
  validator: >-
    {% if not package_name | regex_search('^[a-z][a-z0-9_]*$') %}
    Must be a valid Python identifier: lower-case, digits and underscores.
    {% endif %}
