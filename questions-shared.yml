# The language-agnostic question set, !include-ed by copier.yml.
#
# !include must be its own YAML document in copier.yml. Used as a mapping entry
# it fails with InvalidConfigFileError.
#
# Every question carries a help string, a default where one is derivable, and a
# validator wherever a bad answer would produce code that does not compile or a
# service that does not boot.

service_name:
  type: str
  help: Service name, kebab-case — the binary, the OpenAPI title, the log `service` field
  validator: >-
    {% if not service_name | regex_search('^[a-z][a-z0-9-]{1,38}[a-z0-9]$') %}
    Must be a DNS label: lower-case letters, digits and hyphens, starting with a
    letter, ending with a letter or digit, 3-40 characters.
    {% endif %}

service_description:
  type: str
  help: One line. Appears in the README and in OpenAPI's info.description
  default: "A service minted from Mint."

service_owner:
  type: str
  help: Owning team — appears in AGENTS.md and on the target_info metric
  default: unowned

repo_url:
  type: str
  help: Where this service will live, without a scheme (e.g. github.com/acme/my-svc)
  default: "github.com/example/{@ service_name @}"

include_examples:
  type: bool
  help: >-
    Ship the widgets and orders example resources? They demonstrate the layer
    pattern and how one resource depends on another. Answer no for an empty
    service with the same skeleton.
  default: true

env_prefix:
  type: str
  help: >-
    Prefix for configuration environment variables, without the trailing
    underscore (MINT gives MINT_SERVER__PORT)
  default: MINT
  validator: >-
    {% if not env_prefix | regex_search('^[A-Z][A-Z0-9]*$') %}
    Must be upper-case letters and digits, starting with a letter, and must not
    contain an underscore — `__` separates config levels, so an underscore in
    the prefix makes the variable names ambiguous.
    {% elif env_prefix == service_name | upper | replace('-', '_') %}
    A prefix derived from the service name collides with Kubernetes: it injects
    {SVCNAME}_PORT into every pod, so {@ service_name | upper | replace('-', '_') @}_PORT
    would arrive as tcp://10.0.162.149:8080. Use a constant prefix instead.
    {% endif %}

port:
  type: int
  help: Port the API listens on
  default: 8080
  validator: >-
    {% if port < 1024 or port > 65535 %}
    Must be between 1024 and 65535. Ports below 1024 need root.
    {% endif %}

admin_port:
  type: int
  help: Port for /healthz, /readyz and /metrics. Set it equal to `port` to use one listener
  default: "{@ port + 1000 @}"
  validator: >-
    {% if admin_port < 1024 or admin_port > 65535 %}
    Must be between 1024 and 65535. Ports below 1024 need root.
    {% endif %}
