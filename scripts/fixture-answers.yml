# Fixture answers for the parity and verify harnesses.
#
# ONE file generates BOTH languages. That is itself the check: `language` is
# supplied on the command line, and the `when:` gates discard whichever of
# module_path / package_name doesn't apply. If this file ever needs to be
# split in two, the single-question-set property has been lost.
#
# Used by: scripts/parity.sh, scripts/verify-template.sh

service_name: widget-svc
service_description: A fixture service used by mint's parity and verify harnesses.
service_owner: platform-engineering
repo_url: github.com/acme/widget-svc
port: 18080
admin_port: 19080

# Both are supplied; copier.yml's `when:` gates keep exactly one.
module_path: github.com/acme/widget-svc
package_name: widget_svc
